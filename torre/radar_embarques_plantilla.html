<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Llegadas al Callao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Paleta Cliente. Dos superficies: papel (lista y detalle) e instrumento en Deep Blue 1 (rama y carta).
   Rojo = atraso o fuera de SLA; morado = por llegar o en el terminal. El movimiento solo responde a un clic. */
:root {
  --mar: #0F1B3D; --tierra: #1C2E58; --costa: #2F6DB5; --reticula: #16244A;
  --rojo: #E4572E; --rojo-d2: #A3341C; --pr2: #FCEDE8;
  --mor2: #5B3E96; --mor1: #3A2766; --pp1: #CFC3E6; --pp2: #EEE9F7;
  --azul2: #2F6DB5; --pb1: #C8D6EE; --pb2: #EAEEF5;
  --negro: #1A1726; --gris-o: #4A4658; --gris-m: #A9A6B4; --gris-p: #E6E2E4; --blanco: #FFFFFF;
  --texto: 'Barlow', 'Segoe UI', Arial, sans-serif;
  --angosta: 'Barlow Condensed', 'Arial Narrow', 'Segoe UI', sans-serif;
  --t-1: .8125rem; --t0: .875rem; --t1: 1.0625rem; --t2: 1.25rem; --t3: 1.5rem; --t4: 1.875rem;
  --radio: 6px;
  --salida: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light; accent-color: var(--mor2);
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--gris-m) transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--texto); font-size: var(--t0); line-height: 1.45; color: var(--negro); background: var(--blanco);
       display: grid; grid-template-rows: auto auto minmax(0, 1fr); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
a { color: var(--mor2); text-underline-offset: 3px; }
::selection { background: var(--pp1); color: var(--negro); }
:focus-visible { outline: 2px solid var(--rojo); outline-offset: 2px; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7;
       stroke-linecap: round; stroke-linejoin: round; }

/* ── Banda y pestañas ─────────────────────────────────────────────────── */
.banda { background: var(--mor1); color: var(--blanco); border-bottom: 3px solid var(--rojo);
         display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 32px; align-items: center; padding-block: 12px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.titulo h1 { margin: 0; font: 600 var(--t3)/1 var(--angosta); }
.sello { margin: 5px 0 0; font-size: var(--t-1); display: flex; flex-wrap: wrap; gap: 2px 16px; }
.buscar { position: relative; justify-self: end; width: min(100%, 560px); }
.buscar .lupa { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--gris-o); pointer-events: none; }
.buscar input { width: 100%; height: 40px; border: 1px solid var(--mor2); border-radius: var(--radio); background: var(--blanco);
                color: var(--negro); padding: 0 42px 0 36px; font: inherit; caret-color: var(--rojo); }
.buscar input::placeholder { color: var(--gris-o); }
.buscar input::-webkit-search-cancel-button { display: none; }
.buscar button { position: absolute; right: 4px; top: 50%; translate: 0 -50%; width: 32px; height: 32px; border: 0;
                 border-radius: var(--radio); background: none; color: var(--gris-o); cursor: pointer; display: grid; place-items: center;
                 transition: background-color 150ms var(--salida), scale 150ms var(--salida); }
.buscar button:active { scale: .97; }

.pestanas { display: flex; align-items: stretch; gap: 28px; background: var(--blanco); border-bottom: 1px solid var(--gris-p);
            padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pestanas [role="tab"] { border: 0; background: none; padding: 12px 2px 10px; cursor: pointer; display: inline-flex;
                         align-items: center; gap: 8px; font: 600 var(--t1)/1.2 var(--angosta); color: var(--gris-o);
                         box-shadow: inset 0 -3px 0 transparent; transition: color 150ms var(--salida), box-shadow 150ms var(--salida); }
.pestanas [role="tab"][aria-selected="true"] { color: var(--negro); box-shadow: inset 0 -3px 0 var(--rojo); }
.pestanas .n { font: 600 12px/1 var(--texto); background: var(--gris-p); color: var(--negro); border-radius: 999px;
               padding: 3px 7px; min-width: 22px; text-align: center; }
.pestanas [aria-selected="true"] .n { background: var(--pp2); }
.otra { margin: 0 0 0 auto; align-self: center; }
.enlace-texto { border: 0; background: none; padding: 6px 0; color: var(--mor2); font-weight: 600; cursor: pointer;
                text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--pp1); }

/* ── Cuerpo: papel a la izquierda, instrumento a la derecha ──────────── */
.cuerpo { display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); min-height: 0; }
.panel { overflow-y: auto; min-height: 0; border-right: 1px solid var(--gris-p); background: var(--blanco); }

.grupo-cab { display: flex; align-items: baseline; gap: 10px; padding: 16px 16px 2px; }
.grupo-cab h2 { margin: 0; font: 600 var(--t1)/1.2 var(--angosta); }
.grupo-cab .n { font: 700 var(--t1)/1 var(--angosta); color: var(--estado-texto); }
.grupo-desc { margin: 0 16px 10px; font-size: var(--t-1); }
.fila { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px;
        padding: 11px 16px 12px; border: 0; border-top: 1px solid var(--gris-p); background: var(--blanco); text-align: left;
        cursor: pointer; transition: background-color 150ms var(--salida); }
.fila .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--punto); margin-top: 6px; }
.fila .nombre { font: 600 var(--t1)/1.25 var(--angosta); min-width: 0; overflow-wrap: anywhere; }
.fila .cuando { grid-column: 3; grid-row: 1 / span 2; text-align: right; }
.fila .cuando b { display: block; font: 700 var(--t3)/1 var(--angosta); color: var(--estado-texto); }
.fila .cuando span { font-size: 12px; }
.fila .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: var(--t-1); }
.fila .chips { grid-column: 2 / span 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.fila:active { background: var(--pp1); }

.e-vencida, .e-fuera_sla { --punto: var(--rojo); --estado-texto: var(--rojo-d2); }
.e-por_arribar, .e-en_terminal { --punto: var(--mor2); --estado-texto: var(--mor2); }
.e-en_callao { --punto: var(--gris-o); --estado-texto: var(--negro); }
.e-en_puerto { --punto: var(--azul2); --estado-texto: var(--azul2); }
.cuerpo[hidden], .extra[hidden] { display: none !important; }
.extra { box-sizing: border-box; width: 100%; overflow-wrap: anywhere; }
.pestanas { overflow-x: auto; scrollbar-width: none; } .pestanas [role="tab"] { flex: 0 0 auto; white-space: nowrap; }
@media (max-width: 640px) { .sap { white-space: normal; } .kpi { min-width: 0; flex: 1 1 140px; } }
.chip-estado.e-en_puerto { --borde: var(--azul2); --fondo: var(--pb2); }
/* paso 5: vistas Salida a DC y Alertas ETA */
.extra { padding: 16px clamp(12px, 3vw, 32px) 40px; max-width: 1280px; }
.extra h2 { font-family: var(--angosta); font-size: var(--t3); margin: 12px 0 6px; color: var(--negro); }
.extra .grupo-desc { margin: 0 0 12px; color: var(--gris-o); font-size: var(--t0); }
.kpis { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 10px; }
.kpi { border: 1px solid var(--gris-p); border-left: 4px solid var(--mor2); border-radius: var(--radio); padding: 8px 14px; background: var(--blanco); min-width: 150px; }
.kpi b { display: block; font-family: var(--angosta); font-size: var(--t4); line-height: 1.1; color: var(--negro); font-variant-numeric: tabular-nums; }
.kpi span { font-size: var(--t-1); color: var(--gris-o); }
.kpi.mal { border-left-color: var(--rojo); } .kpi.mal b { color: var(--rojo-d2); }
.tabla { width: 100%; border-collapse: collapse; font-size: var(--t0); font-variant-numeric: tabular-nums; }
.tabla th { text-align: left; font-weight: 600; color: var(--gris-o); border-bottom: 2px solid var(--gris-p); padding: 6px 8px; background: var(--blanco); }
.tabla td { border-bottom: 1px solid var(--gris-p); padding: 7px 8px; vertical-align: top; color: var(--negro); }
.tabla tr:hover td { background: var(--pp2); }
.sap { display: inline-block; border-radius: 99px; padding: 1px 8px; font-size: var(--t-1); border: 1px solid; margin: 1px 4px 1px 0; white-space: nowrap; }
.sap.ingresado { border-color: var(--azul2); background: var(--pb2); }
.sap.pendiente { border-color: var(--rojo); background: var(--pr2); }
.sap.sinm4 { border-color: var(--gris-m); background: var(--gris-p); }
.delta { font-weight: 700; color: var(--rojo-d2); } .delta.adelanta { color: var(--azul2); }
@media (max-width: 640px) { .tabla thead { display: none; } .tabla tr { display: block; border-bottom: 1px solid var(--gris-p); padding: 6px 0; }
  .tabla td { display: block; border: 0; padding: 2px 8px; } .tabla td[data-l]::before { content: attr(data-l) ': '; color: var(--gris-o); } }
.chip { display: inline-flex; align-items: center; font-size: 12px; line-height: 1.2; padding: 3px 8px; border-radius: 999px;
        border: 1px solid var(--borde, var(--gris-m)); background: var(--fondo, var(--blanco)); color: var(--negro); }
.chip-estado.e-vencida, .chip-estado.e-fuera_sla, .c-alerta { --borde: var(--rojo); --fondo: var(--pr2); }
.chip-estado.e-por_arribar, .chip-estado.e-en_terminal, .a-vigente { --borde: var(--mor2); --fondo: var(--pp2); }
.chip-estado.e-en_callao { --borde: var(--gris-o); --fondo: var(--gris-p); }
.a-anticipado { --borde: var(--azul2); --fondo: var(--pb2); }

.pie { padding: 16px 16px 28px; display: grid; gap: 10px; font-size: var(--t-1); border-top: 1px solid var(--gris-p); }
.pie h3 { margin: 0; font: 600 15px/1.2 var(--angosta); }
.pie ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.pie p { margin: 0; }
.alerta { background: var(--pr2); border: 1px solid var(--rojo); border-radius: var(--radio); padding: 8px 10px; color: var(--negro); margin: 0; }
.vacio { padding: 28px 16px 16px; margin: 0; }
.error-aereo { margin: 16px; }
.error-aereo h2 { margin: 0 0 6px; font: 600 var(--t1)/1.2 var(--angosta); }
.error-aereo p { margin: 0 0 6px; }

/* Detalle: migas, cabecera, secciones y la lista de lo que contiene */
.migas { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; padding: 14px 16px 0; font-size: var(--t-1); }
.migas .sep { color: var(--gris-m); }
.det-cab { padding: 6px 16px 14px; border-bottom: 1px solid var(--gris-p); }
.det-cab h2 { margin: 0; font: 700 var(--t4)/1.05 var(--angosta); overflow-wrap: anywhere; display: flex; flex-wrap: wrap;
              align-items: center; gap: 4px 10px; }
.det-cab .linea { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: var(--t-1); }
.seccion { padding: 14px 16px; border-bottom: 1px solid var(--gris-p); }
.seccion h3 { margin: 0 0 10px; font: 600 var(--t1)/1.2 var(--angosta); }
.seccion p { margin: 0 0 8px; }
.seccion p:last-child { margin-bottom: 0; }
.dato-grande { font: 700 var(--t3)/1.05 var(--angosta); }
.pares { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; margin: 0; }
.pares dt { color: var(--gris-o); }
.pares dd { margin: 0; overflow-wrap: anywhere; }
.conteo { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
.conteo div { display: grid; }
.conteo b { font: 700 var(--t3)/1 var(--angosta); }
.conteo span { font-size: 12px; }
.conteo .mal b { color: var(--rojo-d2); }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.boton { border: 1px solid var(--mor2); border-radius: var(--radio); background: var(--blanco); color: var(--mor1); padding: 7px 12px;
         font-weight: 600; cursor: pointer; transition: background-color 150ms var(--salida), scale 150ms var(--salida); }
.boton:active { scale: .97; }
.copiar { border: 1px solid var(--gris-m); border-radius: var(--radio); background: var(--blanco); color: var(--negro);
          padding: 2px 7px; font: 500 12px/1.4 var(--texto); cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
          vertical-align: middle; transition: background-color 150ms var(--salida), scale 150ms var(--salida); }
.copiar .ico { width: 13px; height: 13px; }
.copiar:active { scale: .97; }
.hijos { display: grid; border-top: 1px solid var(--gris-p); }
.hijo { display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; column-gap: 10px; align-items: center; text-align: left;
        border: 0; border-bottom: 1px solid var(--gris-p); background: none; padding: 8px 4px 8px 0; cursor: pointer;
        transition: background-color 150ms var(--salida); }
.hijo .t { font: 600 15px/1.2 var(--angosta); overflow-wrap: anywhere; }
.hijo .s { grid-column: 1; font-size: 12.5px; overflow-wrap: anywhere; }
.hijo .pc { grid-column: 2; grid-row: 1 / span 2; font: 600 var(--t0)/1 var(--angosta); }
.hijo .ico { grid-column: 3; grid-row: 1 / span 2; color: var(--mor2); }
.hijo:active { background: var(--pp1); }
mark { background: var(--pp1); color: var(--negro); border-radius: 2px; padding: 0 1px; }

/* Cinta de fechas: el rango [desde, a más tardar] contra hoy y la ETA del AIS */
.cinta { position: relative; height: 46px; margin: 6px 6px 2px; }
.cinta .eje { position: absolute; left: 0; right: 0; top: 22px; height: 2px; background: var(--gris-p); }
.cinta .rango { position: absolute; top: 15px; height: 16px; background: var(--pp2); border: 1.5px solid var(--mor2); border-radius: 3px; }
.cinta.vencida .rango { background: var(--pr2); border-color: var(--rojo); }
.cinta .hoy { position: absolute; top: 4px; bottom: 0; width: 2px; background: var(--negro); }
.cinta .hoy span { position: absolute; top: -2px; left: 5px; font-size: 11px; font-weight: 600; }
.cinta .ais-eta { position: absolute; top: 16px; width: 12px; height: 12px; margin-left: -6px; background: var(--rojo);
                  transform: rotate(45deg); border: 2px solid var(--blanco); }
.cinta-ley { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px 12px; font-size: var(--t-1); }
.cinta-ley b { display: block; font: 600 16px/1.2 var(--angosta); }
.escalas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.escalas li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; }
.escalas .proxima { font-weight: 600; }

/* ── Instrumento: rama y carta ────────────────────────────────────────── */
.vista { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--mar); color: var(--blanco); }
.vista :focus-visible { outline-color: var(--blanco); }
.barra-vista { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--reticula); }
.segmentos { display: inline-flex; gap: 2px; padding: 3px; border-radius: calc(var(--radio) + 3px); background: var(--reticula); }
.segmentos button { border: 0; border-radius: var(--radio); background: none; color: var(--blanco); padding: 6px 14px; cursor: pointer;
                    font-weight: 600; transition: background-color 150ms var(--salida), color 150ms var(--salida), scale 150ms var(--salida); }
.segmentos button[aria-pressed="true"] { background: var(--blanco); color: var(--mor1); }
.segmentos button:active { scale: .97; }
.estado-vista { margin: 0; font-size: var(--t-1); flex: 1 1 260px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; }
.estado-vista .alerta { padding: 4px 8px; }

.rama { position: relative; overflow: auto; min-height: 0; overscroll-behavior: contain; background-color: var(--mar);
        background-image: linear-gradient(var(--reticula) 1px, transparent 1px), linear-gradient(90deg, var(--reticula) 1px, transparent 1px);
        background-size: 48px 48px; background-attachment: local; scrollbar-color: var(--costa) var(--mar); }
.plano { position: relative; min-width: 100%; min-height: 100%; }
.plano > svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.enlace { fill: none; stroke: var(--pb1); stroke-linecap: round; }
.enlace.n-buque, .enlace.n-hawb { stroke: var(--pp1); }
.enlace.e-vencida, .enlace.e-fuera_sla { stroke: var(--rojo); }
.enlace.e-en_callao { stroke: var(--blanco); }
.enlace.n-pedido, .enlace.n-stock, .enlace.n-revisar { stroke-dasharray: 3 4; }
.enlace.n-mas { stroke-dasharray: 2 5; }
.pct { font: 600 11.5px var(--texto); fill: var(--blanco); font-variant-numeric: tabular-nums;
       paint-order: stroke; stroke: var(--mar); stroke-width: 4px; stroke-linejoin: round; }   /* la rama no tacha la cifra */
.nodos { position: absolute; inset: 0; }
.nodo { position: absolute; left: 0; top: 0; height: 44px; display: flex; align-items: center; gap: 7px; padding: 0 5px 0 9px;
        border: 0; border-radius: var(--radio); background: var(--fondo, var(--blanco)); color: var(--negro); text-align: left;
        cursor: pointer; will-change: transform, opacity;
        transition: background-color 150ms var(--salida), box-shadow 150ms var(--salida), scale 150ms var(--salida); }
.nodo .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--punto); flex: none; }
.nodo .txt { flex: 1; min-width: 0; display: grid; }
.nodo .t { font: 600 15px/1.15 var(--angosta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nodo .s { font-size: 12px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nodo .cuenta { flex: none; display: inline-flex; align-items: center; padding: 2px 1px 2px 5px; border-radius: 999px;
                background: var(--gris-p); color: var(--negro); font: 600 11px/1 var(--texto); }
.nodo .cuenta .ico { width: 12px; height: 12px; transition: rotate 200ms var(--salida); }
.nodo[aria-expanded="true"] .cuenta .ico { rotate: 180deg; }
.nodo:active { scale: .97; }
.n-raiz { --fondo: var(--mor2); color: var(--blanco); }
.n-raiz .t { font-size: 17px; }
.n-pedido { --fondo: var(--pp2); }
.n-stock { --fondo: var(--gris-p); }
.n-revisar { --fondo: var(--pr2); box-shadow: inset 0 0 0 1px var(--rojo); }
.n-mas { --fondo: var(--mar); color: var(--blanco); box-shadow: inset 0 0 0 1px var(--costa); }
.nodo.coincide { box-shadow: 0 0 0 2px var(--pp1); }
.nodo.sel { box-shadow: 0 0 0 3px var(--rojo); }
.nodo:focus-visible { outline: 2px solid var(--blanco); outline-offset: 4px; }
.rama-vacia { position: absolute; left: 50%; top: 50%; translate: -50% -50%; margin: 0; max-width: 320px; text-align: center; pointer-events: none; }

.carta { position: relative; overflow: hidden; overflow: clip; min-height: 0; background: var(--mar); touch-action: none; }
/* clip y no hidden: con hidden, el foco o un clic en un nodo medio afuera desplaza la carta y la descuadra */
.carta canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.carta canvas.arrastrando { cursor: grabbing; }
.capa { position: absolute; inset: 0; pointer-events: none; }
.marca { position: absolute; left: 0; top: 0; pointer-events: auto; border: 0; background: none; padding: 0; cursor: pointer;
         display: flex; align-items: center; gap: 6px; color: var(--blanco); }
.marca .punto { width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--punto); border: 2px solid var(--blanco);
                flex: none; transition: scale 150ms var(--salida); }
.marca .rotulo { font: 600 14px/1 var(--angosta); white-space: nowrap; text-shadow: 0 0 3px var(--mar), 0 0 3px var(--mar), 0 0 2px var(--mar); }
.marca .rotulo small { font: 500 11.5px var(--texto); margin-left: 4px; }
.marca.sel .punto { scale: 1.3; border-color: var(--rojo); }
.marca.atenuada { opacity: .25; }
.rama-carta { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.rama-carta > svg { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
.rama-carta .nodo { pointer-events: auto; }
.carta.con-rama .marca:not(.sel) { opacity: .4; }
.carta.con-rama .marca.sel .rotulo { visibility: hidden; }        /* la caja del buque reemplaza su rótulo */
.carta.con-rama .leyenda, .carta.con-rama .resumen-carta { display: none; }
.resumen-carta { position: absolute; left: 16px; top: 16px; width: 272px; background: rgba(255,255,255,.97); color: var(--negro);
  border-radius: 10px; box-shadow: 0 6px 24px rgba(17,24,79,.35); padding: 14px 14px 10px; border-top: 4px solid var(--mor2); }

.resumen-carta .est { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--gris-p); border-radius: 8px; padding: 6px 8px;
  display: grid; grid-template-columns: 10px 1fr; column-gap: 6px; align-items: center; }

.resumen-carta .prox { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; width: 100%;
  padding: 6px 4px; border-bottom: 1px solid var(--gris-p); font-size: var(--t0); }
.resumen-carta .prox:hover, .resumen-carta .prox:focus-visible { background: var(--pp2); }

@media (max-width: 900px) { .resumen-carta { display: none; } .carta.con-resumen .leyenda { display: block; } }
.m-vencida { --punto: var(--rojo); }
.m-en_callao { --punto: var(--blanco); }

.marca .rotulo { position: absolute; top: 50%; transform: translateY(-50%); left: 14px; }

.marca.sin-rotulo .rotulo { display: none; } .marca.sin-rotulo:hover .rotulo, .marca.sin-rotulo:focus-visible .rotulo { display: block; z-index: 2; }
.puerto-grupo { position: absolute; left: 0; top: 0; pointer-events: auto; border: 2px solid var(--blanco); border-radius: 99px;
  background: var(--azul2); color: var(--blanco); font: 600 13px/1 var(--angosta); padding: 6px 10px; cursor: pointer; white-space: nowrap; }

                    color: var(--mor1); font-weight: 600; cursor: pointer; display: grid; place-items: center;
                    transition: background-color 150ms var(--salida), scale 150ms var(--salida); }

           border-radius: var(--radio); padding: 8px 12px; font-size: 12.5px; display: grid; gap: 4px; }

             border: 1.5px solid var(--mar); margin-right: 5px; vertical-align: -1px; }

/* hover solo con mouse: en pantalla táctil se queda pegado */

<section class="extra" id="extra" role="tabpanel" hidden></section>
<script>
const D = /*__DATOS__*/{};
const TOPO = /*__MAPA__*/null;

const MAR = Object.assign({ buques: [], fuera: {} }, D.maritimo);
const AER = Object.assign({ hawbs: [], en_ruta: 0, sla_hab: 3, error: null, paso_fuera_sla: '', paso_aviso: '' }, D.aereo);
const DIAS = D.dias_proximo ?? 3, RADIO = D.radio_cerca_km ?? 1500;
const QUIETO = window.matchMedia('(prefers-reduced-motion: reduce)');
const ICONO = {
  chevron: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>',
  copiar: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></svg>'
};
const $ = id => document.getElementById(id);

/* ── utilidades ─────────────────────────────────────────────────────────── */
let consulta = '';
function esc(t) { return String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function miles(n) { return n == null ? '—' : Number(n).toLocaleString('es-PE', { maximumFractionDigits: 1 }); }
function norm(t) { return String(t ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function fechaCorta(iso) { if (!iso) return '—'; const [, m, d] = iso.slice(0, 10).split('-'); return `${d}/${m}`; }
function horaCorta(iso) { return iso && iso.length >= 16 ? `${fechaCorta(iso)} ${iso.slice(11, 16)}` : fechaCorta(iso); }
function plural(n, uno, varios) { return `${miles(n)} ${n === 1 ? uno : varios}`; }
function pct(p) { return p == null ? '' : p < 0.01 ? '<1 %' : `${Math.round(p * 100)} %`; }
function suma(valores) { const v = valores.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; }
function resaltar(t) {
  const crudo = String(t ?? '');
  if (!consulta) return esc(crudo);
  const i = norm(crudo).indexOf(consulta);
  if (i < 0) return esc(crudo);
  return esc(crudo.slice(0, i)) + '<mark>' + esc(crudo.slice(i, i + consulta.length)) + '</mark>' + esc(crudo.slice(i + consulta.length));
}
function guardar(clave, valor) { try { localStorage.setItem('radar_callao.' + clave, valor); } catch (e) { /* sin almacenamiento */ } }
function leer(clave) { try { return localStorage.getItem('radar_callao.' + clave); } catch (e) { return null; } }
function botonCopiar(valor) { return valor ? `<button type="button" class="copiar" data-copiar="${esc(valor)}">${ICONO.copiar}Copiar</button>` : ''; }

/* ── buques: fechas y estado (reglas de job_radar_embarques) ────────────── */
const TITULO_ESTADO = { vencida: 'ETA vencida sin arribo', en_callao: 'En el Callao según AIS', por_arribar: 'Por arribar',
                        fuera_sla: 'Fuera de SLA', en_terminal: 'En el terminal', en_puerto: 'En puerto, sin salida a DC' };
function enTransito(b) { return b.bls.filter(x => x.hito === 'En tránsito internacional'); }
function rangoBuque(b) {
  const t = enTransito(b);
  return { desde: t.map(x => x.desde).filter(Boolean).sort()[0] || null, hasta: t.map(x => x.hasta).filter(Boolean).sort().slice(-1)[0] || null };
}
function cuando(b) {
  if (b.estado === 'en_callao') return ['Callao', 'según AIS'];
  if (b.estado === 'en_puerto') {                     // paso 5: arribado (ATA de FWD o ETA vencida)
    const f = b.bls.map(x => x.eta_fwd || x.desde || x.eta_reporte).filter(Boolean).sort()[0];
    return f ? [fechaCorta(f), 'arribó'] : ['Puerto', 'sin fecha'];
  }
  if (b.estado === 'vencida') return [`+${-b.dias_hasta} d`, 'de atraso'];
  const d = b.dias_desde, h = b.dias_hasta_max;
  if (d == null && h == null) return ['—', 'sin ETA'];
  if (d != null && d <= 0) return [h === 0 ? 'hoy' : `≤ ${h} d`, 'en su rango'];
  if (h == null || h === d) return [`${d} d`, 'para llegar'];
  return [`${d}–${h} d`, 'para llegar'];
}
function pedidosDe(lineas) { return new Set(lineas.flatMap(l => l.pedidos.map(p => p.so433))).size; }

/* ── modelo de la rama: raíz -> buque o HAWB -> BL -> 422 x MTM -> 433 ─── */
const NODOS = new Map();
const TOPE = 8;                          // más hijos que esto: los primeros y un nodo «N más»
function nodo(padre, tipo, ref, titulo, sub, valor, extra = {}) {
  const n = { id: padre ? `${padre.id}.${padre.hijos.length}` : extra.id, tipo, ref, titulo: titulo ?? '—', sub: sub ?? '',
              valor: valor ?? null, padre, hijos: [], nivel: padre ? padre.nivel + 1 : 0, texto: '', estado: extra.estado || null,
              todos: false, coincide: false, contiene: false, bajoCoincidencia: false };
  if (padre) padre.hijos.push(n);
  NODOS.set(n.id, n);
  return n;
}
function ramaLinea(padre, l) {
  const n = nodo(padre, 'linea', l, l.so, `${l.mtm}, ${miles(l.cantidad)} u.`, l.cantidad);
  n.texto = norm(`${l.so} | ${l.mtm}`);
  if (l.pedidos.length) {
    l.pedidos.forEach(p => {
      const h = nodo(n, 'pedido', p, p.so433, p.cliente || 'Cliente sin nombre en OM', null);
      h.texto = norm([p.so433, p.cliente, p.sold_to].join(' | '));
    });
  } else if (l.vinculo === 'SO en OrderMatch con otro MTM') nodo(n, 'revisar', l, 'Revisar', 'SO en OM con otro MTM', null);
  else nodo(n, 'stock', l, 'Stock', 'sin pedido 433', null);
}
function arbolMaritimo() {
  const raiz = nodo(null, 'raiz', null, 'Callao', '', null, { id: 'm' });
  for (const b of MAR.buques) {
    const [g, c] = cuando(b);
    const nb = nodo(raiz, 'buque', b, b.nombre, `${g} ${c}`, suma(b.bls.map(x => x.unidades)), { estado: b.estado });
    nb.texto = norm([b.nombre, b.naviera, b.imo, b.mmsi].join(' | '));
    b._nodo = nb;
    for (const x of b.bls) {
      const sub = `${miles(x.unidades)} u., ${x.aviso_estado ? `aviso ${x.aviso_estado}` : plural(x.contenedores.length, 'cont.', 'cont.')}`;
      const nx = nodo(nb, 'bl', x, x.bl, sub, x.unidades);
      nx.texto = norm([x.bl, ...x.contenedores, x.ruta, x.origen, x.naviera].join(' | '));
      x.lineas.forEach(l => ramaLinea(nx, l));
    }
  }
  return cerrarRaiz(raiz, 'buque', 'buques');
}
function arbolAereo() {
  const raiz = nodo(null, 'raiz', null, 'Terminal', '', null, { id: 'a' });
  for (const h of AER.hawbs) {
    const nh = nodo(raiz, 'hawb', h, h.hawb, `${plural(h.dias_hab, 'día háb.', 'días háb.')}, SLA ${miles(h.sla_hab)}`, h.unidades,
                    { estado: h.fuera_sla ? 'fuera_sla' : 'en_terminal' });
    nh.texto = norm(h.hawb);
    h._nodo = nh;
    h.lineas.forEach(l => ramaLinea(nh, l));
  }
  return cerrarRaiz(raiz, 'HAWB', 'HAWB');
}
function cerrarRaiz(raiz, uno, varios) {
  raiz.valor = suma(raiz.hijos.map(h => h.valor));
  raiz.sub = plural(raiz.hijos.length, uno, varios) + (raiz.valor == null ? '' : `, ${miles(raiz.valor)} u.`);
  return raiz;
}
const ARBOL = { mar: arbolMaritimo(), aer: arbolAereo() };
const ESTADO = { mar: { abiertos: new Set(), sel: null, previos: null }, aer: { abiertos: new Set(), sel: null, previos: null } };
const HASH_INICIAL = location.hash;                 // paso 5: #salida_dc / #alertas_eta antes de que se reescriba
let pestana = location.hash === '#aereo' ? 'aer' : 'mar';
let vistaMar = leer('vista') === 'carta' ? 'carta' : 'rama';
function pestanaDe(n) { return n.id[0] === 'm' ? 'mar' : 'aer'; }
function parte(n) {
  if (['pedido', 'stock', 'revisar'].includes(n.tipo) || n.valor == null || !n.padre || !n.padre.valor) return null;
  return Math.max(0, Math.min(1, n.valor / n.padre.valor));
}

/* búsqueda: coincide = su propio texto; contiene = él o algo debajo; bajoCoincidencia = un ancestro coincide */
function marcar(n, arriba) {
  n.coincide = !!consulta && n.texto.includes(consulta);
  n.bajoCoincidencia = arriba;
  let contiene = n.coincide;
  for (const h of n.hijos) contiene = marcar(h, arriba || n.coincide) || contiene;
  n.contiene = contiene;
  return contiene;
}
function hijosVisibles(n) {
  const e = ESTADO[pestanaDe(n)];
  if (!n.hijos.length || (n.tipo !== 'raiz' && !e.abiertos.has(n.id))) return [];
  let hijos = n.hijos;
  if (consulta && !n.coincide && !n.bajoCoincidencia) hijos = hijos.filter(h => h.contiene);
  if (consulta || n.todos || hijos.length <= TOPE) return hijos;
  if (!n._mas) {
    n._mas = { id: `${n.id}.mas`, tipo: 'mas', ref: null, padre: n, hijos: [], nivel: n.nivel + 1, texto: '', estado: null };
    NODOS.set(n._mas.id, n._mas);
  }
  const ocultos = hijos.slice(TOPE - 1);
  Object.assign(n._mas, { titulo: `${ocultos.length} más`, sub: 'ver todos', valor: suma(ocultos.map(h => h.valor)) });
  return [...hijos.slice(0, TOPE - 1), n._mas];
}
function hojasVisibles(n) { const h = hijosVisibles(n); return h.length ? h.reduce((s, x) => s + hojasVisibles(x), 0) : 1; }
function abrirRama(n, presupuesto = 24) {
  // abre por niveles mientras la rama quepa en ~24 hojas: un buque chico se ve entero, uno grande hasta donde cabe
  const e = ESTADO[pestanaDe(n)];
  if (!n.hijos.length) return;
  e.abiertos.add(n.id);
  let frente = [n];
  while (frente.length) {
    const nivel = frente.flatMap(hijosVisibles).filter(h => h.hijos.length && h.tipo !== 'mas');
    if (!nivel.length) break;
    nivel.forEach(h => e.abiertos.add(h.id));
    if (hojasVisibles(n) > presupuesto) { nivel.forEach(h => e.abiertos.delete(h.id)); break; }
    frente = nivel;
  }
}
function cerrar(n) {
  const e = ESTADO[pestanaDe(n)];
  (function quitar(m) { e.abiertos.delete(m.id); m.hijos.forEach(quitar); })(n);
}

/* ── la rama en pantalla: un mismo dibujo con dos motores ──────────────────
   motor «rama»:  la vista Rama, desde la raíz (Callao o Terminal), con scroll propio
   motor «carta»: sobre la carta, desde el punto del buque elegido; sigue al buque al mover o acercar la carta */
const SVGNS = 'http://www.w3.org/2000/svg';
const ALTO = 44, PASO = 54, GAP = 48, PAD = 20, SEP_GRUPO = 10;
const COLUMNAS = { mar: [136, 184, 184, 172, 168], aer: [136, 184, 172, 168] };   // caben en 1440 px junto al panel
const rama = $('rama'), plano = $('plano'), svgRama = $('svg-rama'), ramaCarta = $('rama-carta');
function crearMotor(sufijo) {
  return { capa: $(`nodos${sufijo}`), gEnlaces: $(`g-enlaces${sufijo}`), gPct: $(`g-pct${sufijo}`),
           elNodo: new Map(), elEnlace: new Map(), actuales: new Map(), animacion: 0, L: null };
}
const MOTOR = { rama: crearMotor(''), carta: crearMotor('-carta') };
let cartaDe = null;                      // nodo del buque cuya rama está sobre la carta
function enCarta() { return pestana === 'mar' && vistaMar === 'carta'; }
function anchoDe(n) { return COLUMNAS[pestanaDe(n)][n.nivel]; }

function disponer(raiz) {
  // árbol ordenado: hojas una debajo de otra, cada padre a la altura media de sus hijos; x por columna desde la raíz
  const anchos = COLUMNAS[pestanaDe(raiz)], xs = [];
  for (let k = raiz.nivel, x = 0; k < anchos.length; k++) { xs[k] = x; x += anchos[k] + GAP; }
  const L = new Map();
  let y = 0, padrePrevio = null;
  (function visitar(n) {
    const hijos = hijosVisibles(n);
    if (!hijos.length) {

  let h = `<p class="grupo-desc">BL cuya ETA vigente se movió más de ${D.umbral_eta_dias ?? 5} días contra la versión anterior del historial. El compromiso se mide sobre la ETA más reciente.</p>`;
  if (!AET.length) return h + vacio('Ninguna ETA se movió más del umbral.');
  if (!filas.length) return h + vacio(`Nada coincide con «${esc($('q').value.trim())}».`);
  h += '<table class="tabla"><thead><tr><th>BL / HAWB</th><th>Buque</th><th>Modo</th><th>ETA anterior</th><th>ETA nueva</th><th>Cambio</th><th>Visto</th></tr></thead><tbody>';
  for (const a of filas) {
    const d = a.delta_dias, txt = d > 0 ? `+${d} d (se atrasa)` : `${d} d (se adelanta)`;
    h += `<tr><td data-l="BL"><b>${resaltar(a.bl)}</b></td><td data-l="Buque">${resaltar(a.buque || '—')}</td><td data-l="Modo">${esc(a.mot || '')}</td><td data-l="ETA anterior">${fechaCorta(a.eta_anterior)}</td><td data-l="ETA nueva">${fechaCorta(a.eta_nueva)}</td><td data-l="Cambio"><span class="delta${d < 0 ? ' adelanta' : ''}">${txt}</span></td><td data-l="Visto">${fechaCorta(a.visto)}</td></tr>`;
  }
  return h + '</tbody></table>';
}
function pintarExtra() {
  if (extraActiva) $('extra').innerHTML = `<h2>${extraActiva === 'dc' ? 'Salida a DC' : 'Alertas de ETA'}</h2>` + (extraActiva === 'dc' ? vistaDC() : vistaETA());
}
function abrirExtra(t) {
  extraActiva = t;
  for (const el of [...Object.values(TABS), ...Object.values(TABS_EXTRA)]) { el.setAttribute('aria-selected', 'false'); el.tabIndex = -1; }
  TABS_EXTRA[t].setAttribute('aria-selected', 'true'); TABS_EXTRA[t].tabIndex = 0;
  $('cuerpo').hidden = true; $('extra').hidden = false; $('extra').setAttribute('aria-labelledby', TABS_EXTRA[t].id);
  try { history.replaceState(null, '', t === 'dc' ? '#salida_dc' : '#alertas_eta'); } catch (err) { /* archivo local */ }
  pintarExtra();
}
function cerrarExtra() { extraActiva = null; $('extra').hidden = true; $('cuerpo').hidden = false; }
$('pestanas').addEventListener('click', e => {
  const x = e.target.closest('[data-extra]'), t = e.target.closest('[data-tab]');
  if (x) abrirExtra(x.dataset.extra);
  else if (t && extraActiva) { cerrarExtra(); cambiarPestana(t.dataset.tab); }
});
$('q').addEventListener('input', () => { clearTimeout(window._esperaExtra); window._esperaExtra = setTimeout(pintarExtra, 120); });
if (HASH_INICIAL === '#salida_dc') abrirExtra('dc');
else if (HASH_INICIAL === '#alertas_eta') abrirExtra('eta');

// ══ paso 5 · ajuste 6: tarjeta de resumen sobre el océano (reemplaza la leyenda en pantallas anchas) ══
(function resumenCarta() {
  const caja = $('resumen-carta'); if (!caja || !MAR.buques.length) return;
  const cuenta = k => MAR.buques.filter(b => b.estado === k).length;
  const est = [['vencida', 'ETA vencida', 'm-vencida'], ['en_callao', 'en el Callao (AIS)', 'm-en_callao'],
               ['por_arribar', 'por arribar', 'm-por_arribar'], ['en_puerto', 'en puerto sin salida', 'e-en_puerto']].filter(([k]) => cuenta(k));
  const proximos = MAR.buques.filter(b => b.estado === 'por_arribar' || b.estado === 'vencida')
    .sort((a, c) => (a.dias_hasta ?? 99) - (c.dias_hasta ?? 99)).slice(0, 4);
  caja.innerHTML = `<h3>${plural(MAR.buques.length, 'buque', 'buques')} hacia el Callao</h3>
    <p class="sub">${miles(MAR.buques.reduce((t, b) => t + (b._nodo?.valor || 0), 0))} u. · AIS de ${MAR.buques.filter(b => b.ais).length} buques</p>
    <div class="estados">${est.map(([k, t, c]) => `<button type="button" class="est ${c}" data-estado="${k}"><i></i><b>${cuenta(k)}</b><span>${t}</span></button>`).join('')}</div>
    ${proximos.length ? `<h4>Próximos arribos</h4>${proximos.map(b => { const [g, c] = cuando(b);
      return `<button type="button" class="prox${b.estado === 'vencida' ? ' tarde' : ''}" data-id="${b._nodo.id}"><b>${esc(b.nombre)}</b><small>${esc(g)} ${esc(c)}</small></button>`; }).join('')}` : ''}
    <p class="nota">Anillo punteado: ${miles(RADIO)} km del Callao. Clic en un estado para ir a su grupo.</p>`;
  caja.hidden = false; $('carta').classList.add('con-resumen');
  caja.addEventListener('click', e => {
    const p = e.target.closest('.prox'), s = e.target.closest('.est');
    if (p) { const n = NODOS.get(p.dataset.id); if (n) seleccionar(n, { desdeCarta: true }); }
    else if (s) { const g = panel.querySelector(`.grupo.e-${s.dataset.estado}`); if (g) g.scrollIntoView({ block: 'start', behavior: QUIETO.matches ? 'auto' : 'smooth' }); }
  });
})();
</script>
